repos:
  - repo: local
    hooks:
      # Lint 检查 (阻断提交)
      - id: ruff
        name: ruff check
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: true
      # 格式化 (自动修正)
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: true
