# ==========================================
# Alembic 配置 — Wings 3.2 数据库迁移引擎
# ==========================================

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库 URL (由 env.py 从环境变量注入，此处仅占位)
# 生产环境通过 DATABASE_URL 环境变量配置
sqlalchemy.url =

# 模板字符编码
output_encoding = utf-8

# 时间戳格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 迁移时自动事务管理
begin_empty = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
